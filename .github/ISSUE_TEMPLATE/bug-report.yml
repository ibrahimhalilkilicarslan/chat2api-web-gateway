name: Bug report
description: Report a reproducible gateway, admin console, or compatibility problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include provider tokens, API keys, cookies, prompts, completions,
        SQLite files, deployment secrets, or private endpoint details. Security
        issues must be reported through GitHub Security Advisories.
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: I removed all credentials and private data from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: input
    id: version
    attributes:
      label: Gateway version
      placeholder: v2.2.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Installation or Docker
        - Admin console
        - Session Connector handoff
        - Account health or routing
        - API key policy
        - OpenAI compatibility
        - Streaming
        - Operations or backup
        - Documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, Docker version, reverse proxy, and client library.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Include only metadata-safe logs or request IDs. Never include request bodies or credentials.
      render: text
